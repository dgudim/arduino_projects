# https://gist.github.com/rubin110/c078a82283a22ee05974e276ca332b8e
esphome:
  name: workroom-blinds
  friendly_name: Workroom blinds
  on_boot:
    then:
      - stepper.report_position:
          id: blinds_stepper
          position: !lambda return id(stepper_position);
      - stepper.set_target:
          id: blinds_stepper
          target: !lambda return id(stepper_position);
      - if: 
          condition:
            - lambda: 'return id(stepper_position) == 0;'
          then: 
            - cover.template.publish:
                id: blinds
                state: Closed
                current_operation: IDLE
          else:
            - cover.template.publish:
                id: blinds
                state: Open
                current_operation: IDLE 

esp32:
  board: lolin_c3_mini
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret workroom_blinds__encryption_key
  services:
    - service: set_closed_position
      then:
        - stepper.report_position:
            id: blinds_stepper
            position: 0
        - stepper.set_target:
            id: blinds_stepper
            target: 0
        - globals.set:
            id: stepper_position
            value: '0'
    - service: set_open_position
      then:
        - stepper.report_position:
            id: blinds_stepper
            position: !lambda return id(stepper_position);
        - stepper.set_target:
            id: blinds_stepper
            target: !lambda return id(stepper_position);
        - globals.set:
            id: end_position
            value: !lambda return id(stepper_position);
    - service: control_stepper
      variables:
        target: int
      then:
        - stepper.set_target:
            id: blinds_stepper
            target: !lambda 'return target;'
        - globals.set:
            id: stepper_position
            value: !lambda return target;

ota:
  - platform: esphome
    password: !secret workroom_blinds__ota_password

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      bssid: !secret wifi_bssid
  reboot_timeout: 60s
  output_power: 19db
  fast_connect: True
  min_auth_mode: WPA2
  manual_ip:
    static_ip: 192.168.50.66
    gateway: 192.168.50.1
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: Workroom-Blinds Fallback Hotspot
    password: !secret fallback_hotspot_password
captive_portal:
    
preferences:
  flash_write_interval: 10s

globals:
  - id: stepper_position
    type: int
    restore_value: true
    initial_value: '0'
  - id: end_position
    type: int
    restore_value: true
    initial_value: '500'

stepper:
  - platform: a4988
    id: blinds_stepper
    sleep_pin: GPIO9
    step_pin: GPIO10
    dir_pin: GPIO8
    max_speed: 3500 steps/s
    acceleration: 600
    deceleration: 600
    

cover:
  - platform: template
    id: blinds
    device_class: blind
    name: "Work room blinds"
    open_action:
      - stepper.set_target:
          id: blinds_stepper
          target: !lambda return id(end_position);
      - globals.set:
          id: stepper_position
          value: !lambda return id(end_position);
    close_action:
      - stepper.set_target:
          id: blinds_stepper
          target: 0
      - globals.set:
          id: stepper_position
          value: '0'
    stop_action:
      - stepper.set_target:
          id: blinds_stepper
          target: !lambda return id(blinds_stepper).current_position;
      - globals.set:
          id: stepper_position
          value: !lambda return id(blinds_stepper).current_position;
    optimistic: true


binary_sensor:
  - platform: gpio
    pin:
      number: GPIO4
      inverted: false 
      mode: 
        input: true 
        pullup: false 
    name: "Blinds trigger button"
    filters:
      - delayed_on: 1000ms
      - delayed_off: 1000ms
          
