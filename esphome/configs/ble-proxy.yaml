esphome:
  name: ble-proxy
  friendly_name: BLE proxy

esp32:
  board: lolin_c3_mini
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret ble_proxy__encryption_key
ota:
  - platform: esphome
    password: !secret ble_proxy__ota_password

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      bssid: !secret wifi_bssid
  reboot_timeout: 60s
  output_power: 19db
  fast_connect: True
  min_auth_mode: WPA2
  manual_ip:
    static_ip: 192.168.50.65
    gateway: 192.168.50.1
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: Ble-Proxy Fallback Hotspot
    password: !secret fallback_hotspot_password
captive_portal:
    
# https://smarthomescene.com/diy/diy-the-smallest-bluetooth-proxy-with-esp32-c3-supermini/
bluetooth_proxy:
  connection_slots: 3
  

esp32_ble_tracker:

sensor:
  - platform: dht
    pin: GPIO10
    humidity:
      id: sensor_dht_1_humidity
      name: TV room humidity
    temperature:
      id: sensor_dht_1_temperature
      name: TV room temperature
      filters:
        - lambda: 'return x - 6.9;' # Compensation
    id: sensor_dht_1
